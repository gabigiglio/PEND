<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produto</title>
    <link rel="stylesheet" href="prodstyle.css">
</head>
<body>
    <h1 id="titulo">Cadastro de Produto</h1>

    <input type="text" id="nome" placeholder="Nome"><br><br>

    <input type="number" id="preco" placeholder="Preço"><br><br>

    <input type="text" id="categoria" placeholder="Categoria"><br><br>

    <input type="number" id="desconto" placeholder="Desconto"><br><br>

    <button id="botaoCadastrar">Cadastrar</button>

    <div id="resultado"></div>


    <script src="prodscript.js"></script>
</body>
</html>
