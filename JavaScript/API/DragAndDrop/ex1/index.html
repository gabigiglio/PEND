<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajude os animais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
</body>
</html>

    <h1>Ajude os animais</h1>

    <div id="mensagem"></div>

<div class="animais">

    <div class="animal" data-comida="cenoura">
        <h2>🐰<br> Coelho</h2>
        <div class="area-drop"></div>
    </div>

    <div class="animal" data-comida="osso">
        <h2>🐶 Cachorro</h2>
        <div class="area-drop"></div>
    </div>

    <div class="animal" data-comida="peixe">
        <h2>🐱<br> Gato</h2>
        <div class="area-drop"></div>
    </div>

    <div class="animal" data-comida="bambu">
        <h2>🐼 <br> Panda</h2>
        <div class="area-drop"></div>
    </div>

    <div class="animal" data-comida="banana">
        <h2>🐵 <br> Macaco</h2>
        <div class="area-drop"></div>
    </div>

    <div class="animal" data-comida="queijo">
        <h2>🐭 <br> Rato</h2>
        <div class="area-drop"></div>
    </div>

</div>

<div class="comidas">

    <div class="comida" draggable="true" data-comida="banana">
        🍌
    </div>

    <div class="comida" draggable="true" data-comida="cenoura">
        🥕
    </div>

    <div class="comida" draggable="true" data-comida="bambu">
        🎋
    </div>

    <div class="comida" draggable="true" data-comida="queijo">
        🧀
    </div>

       <div class="comida" draggable="true" data-comida="peixe">
        🐟
    </div>

    <div class="comida" draggable="true" data-comida="osso">
        🦴
    </div> 

 



</div> <br><br>

<p>Pontos: <span id="pontos">0</span></p>

    <script src="script.js"></script>

</body>
</html>
