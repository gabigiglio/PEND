<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> <!-- Ícones do Bootstrap -->
    <link rel="stylesheet" href="style.css"> <!-- link do css -->
</head>

<body>

    <h2>Cadastro de Usuário</h2>

    <div class="form">
        <!-- Formulário de cadastro -->
        Nome:
        <input type="text" id="nome" placeholder="Ex: Maria Silva">
        <p id="resultadoNome"></p><br><br> <!-- Parágrafo para exibir o resultado da validação do nome -->

        Email:
        <input type="text" id="email" placeholder="Ex: maria@dominio.com">
        <p id="resultadoEmail"></p><br><br> <!-- Parágrafo para exibir o resultado da validação do email -->

        Senha:
        <input type="password" id="senha" placeholder="Ex: senha123">
        <i class="bi bi-eye-fill" id="botaoSenha"></i> <!-- Ícone para mostrar/ocultar senha -->
        <p id="resultadoSenha"></p><br><br> <!-- Parágrafo para exibir o resultado da validação da senha -->

        Telefone:
        <div id="telefones">
            <input type="text" id="telefone" placeholder="Ex: (11) 99999-9999" maxlength="11" />
        </div>
        <!-- Botões para adicionar ou remover campos de telefone -->
        <div class="container-botoes">
            <button type="button" id="addtelefone">➕</button>
            <button type="button" id="removertelefone">➖</button>
        </div><br>
        <p id="resultadoTelefone"></p><br><br> <!-- Parágrafo para exibir o resultado da validação do telefone -->

        <button id="validar">Cadastrar</button> <!-- Botão para validar o cadastro -->

        <p id="resultado"></p> <!-- Parágrafo para exibir o resultado do cadastro -->

    </div>

    <script src="script.js"></script> <!-- link do js -->

</body>

</html>
